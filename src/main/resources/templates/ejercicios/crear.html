<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Ejercicio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:insert="fragments/navbar :: navbar"></div>
<div class="container mt-5">
    <h1>Crear Ejercicio</h1>

    <form th:action="@{/ejercicios}" th:object="${ejercicioDTO}" method="post" class="mt-4 mb-4">
        <div class="mb-3">
            <label for="grupoMuscularId" class="form-label">Grupo Muscular</label>
            <select class="form-control" id="grupoMuscularId" th:field="*{grupoMuscularId}" required>
                <option value="">Selecciona un grupo</option>
                <option th:each="grupo : ${gruposMusculares}"
                        th:value="${grupo.id}"
                        th:text="${grupo.nombre}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
            <small class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" th:field="*{descripcion}"></textarea>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="tipoArticular" class="form-label">Tipo Articular</label>
                <select class="form-control" id="tipoArticular" th:field="*{tipoArticular}">
                    <option value="">No especifica</option>
                    <option th:each="e : ${tiposArticulares}" th:value="${e}" th:text="${e}"></option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label for="cadenaCinetica" class="form-label">Cadena Cinética</label>
                <select class="form-control" id="cadenaCinetica" th:field="*{cadenaCinetica}">
                    <option value="">No especifica</option>
                    <option th:each="e : ${cadenasCineticas}" th:value="${e}" th:text="${e}"></option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label for="lateralidad" class="form-label">Lateralidad</label>
                <select class="form-control" id="lateralidad" th:field="*{lateralidad}">
                    <option value="">No especifica</option>
                    <option th:each="e : ${lateralidades}" th:value="${e}" th:text="${e}"></option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label for="elemento" class="form-label">Elemento</label>
                <select class="form-control" id="elemento" th:field="*{elemento}">
                    <option value="">No especifica</option>
                    <option th:each="e : ${elementos}" th:value="${e}" th:text="${e}"></option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label for="posicion" class="form-label">Posición</label>
                <select class="form-control" id="posicion" th:field="*{posicion}">
                    <option value="">No especifica</option>
                    <option th:each="e : ${posiciones}" th:value="${e}" th:text="${e}"></option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/ejercicios" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
