<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ejercicios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:insert="fragments/navbar :: navbar"></div>
<div th:insert="fragments/error-alert"></div>
<div class="container mt-5">
    <h1>Ejercicios</h1>

    <a href="/ejercicios/crear" class="btn btn-primary mb-3">+ Crear Ejercicio</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Grupo Muscular</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ejercicio : ${ejercicios}">
            <td th:text="${ejercicio.nombre}"></td>
            <td th:text="${ejercicio.descripcion}"></td>
            <td th:text="${ejercicio.grupoMuscular.nombre}"></td>
            <td>
                <a th:href="@{/ejercicios/{id}/editar(id=${ejercicio.id})}" class="btn btn-warning btn-sm">Editar</a>
                <form th:action="@{/ejercicios/{id}/eliminar(id=${ejercicio.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro?')">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
