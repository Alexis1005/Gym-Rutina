<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - GymRutine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --azul-marino: #1B3A57;
            --azul-medio: #2F6EA3;
            --rojo-logo: #D62839;
        }

        body {
            background: linear-gradient(135deg, var(--azul-medio), var(--azul-marino));
            min-height: 100vh;
        }

        .login-container {
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden; /* para que la banda respete las esquinas redondeadas */
        }

        /* Banda superior con el logo */
        .brand-header {
            background: var(--azul-marino);
            border-bottom: 3px solid var(--rojo-logo);
            padding: 24px 16px 18px;
        }

        .logo {
            width: 120px;
            margin-bottom: 10px;
        }

        .brand-title {
            font-weight: 600;
            color: #fff;
            margin: 0;
        }

        .form-control {
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: var(--azul-medio);
            box-shadow: 0 0 0 0.2rem rgba(47, 110, 163, 0.25);
        }

        .btn {
            border-radius: 10px;
        }

        .btn-gym {
            background-color: var(--azul-marino);
            border-color: var(--azul-marino);
            color: #fff;
        }

        .btn-gym:hover,
        .btn-gym:focus {
            background-color: var(--azul-medio);
            border-color: var(--azul-medio);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center login-container">
    <div class="col-md-4">

        <div class="card shadow-lg text-center">

            <!-- Banda con logo -->
            <div class="brand-header">
                <img th:src="@{/images/JRGym.png}" alt="Logo" class="logo mx-auto d-block">
                <h3 class="brand-title">GymRutine</h3>
            </div>

            <div class="p-4">
                <p class="text-muted mb-4">Iniciar sesión</p>

                <!-- ERROR LOGIN -->
                <div th:if="${param.error}" class="alert alert-danger">
                    Usuario o contraseña incorrectos
                </div>

                <!-- LOGOUT -->
                <div th:if="${param.logout}" class="alert alert-success">
                    Sesión cerrada correctamente
                </div>

                <!-- FORM -->
                <form method="post" th:action="@{/login}">

                    <div class="mb-3 text-start">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" placeholder="Ingrese usuario" required>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="Ingrese contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-gym w-100">
                        Ingresar
                    </button>
                </form>
            </div>

        </div>

    </div>
</div>

</body>
</html>
