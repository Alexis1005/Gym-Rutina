<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - GymRutine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #0a3d7a);
            height: 100vh;
        }

        .login-container {
            height: 100vh;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .logo {
            width: 120px;
            margin-bottom: 15px;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }

        .title {
            font-weight: 600;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center login-container">
    <div class="col-md-4">

        <div class="card shadow-lg p-4 text-center">

            <!-- Logo -->
            <img th:src="@{/images/JRGym.png}" alt="Logo" class="logo mx-auto">

            <h3 class="title mb-3">GymRutine</h3>
            <p class="text-muted mb-4">Iniciar sesión</p>

            <!-- ERROR LOGIN -->
            <div th:if="${param.error}" class="alert alert-danger">
                Usuario o contraseña incorrectos
            </div>

            <!-- LOGOUT -->
            <div th:if="${param.logout}" class="alert alert-success">
                Sesión cerrada correctamente
            </div>

            <!-- FORM -->
            <form method="post" th:action="@{/login}">

                <div class="mb-3 text-start">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ingrese usuario" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Ingrese contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Ingresar
                </button>
            </form>

        </div>

    </div>
</div>

</body>
</html>
