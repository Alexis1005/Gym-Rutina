<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Grupos Musculares</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Grupos Musculares</h1>

    <a href="/grupos-musculares/crear" class="btn btn-primary mb-3">+ Crear Grupo</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="grupo : ${grupos}">
            <td th:text="${grupo.nombre}"></td>
            <td>
                <a th:href="@{/grupos-musculares/{id}/editar(id=${grupo.id})}" class="btn btn-warning btn-sm">Editar</a>
                <form th:action="@{/grupos-musculares/{id}/eliminar(id=${grupo.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro?')">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
