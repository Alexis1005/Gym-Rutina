<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bloques</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Bloques</h1>

    <a href="/bloques/crear" class="btn btn-primary mb-3">+ Crear Bloque</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Ejercicios</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="bloque : ${bloques}">
            <td th:text="${bloque.nombre}"></td>
            <td th:text="${bloque.bloqueEjercicio.size()}"></td>
            <td>
                <a th:href="@{/bloques/{id}/editar(id=${bloque.id})}" class="btn btn-warning btn-sm">Editar</a>
                <form th:action="@{/bloques/{id}/eliminar(id=${bloque.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro?')">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
