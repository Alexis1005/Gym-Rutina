<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Rutina - GymRutine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .col-semana {
            font-size: 0.85rem;
            padding: 0.5rem 0.25rem !important;
            min-width: 55px;
        }
        .tabla-progresion th {
            font-size: 0.9rem;
        }
        th[colspan] {
            background-color: #e9ecef;
            font-weight: bold;
        }
        .tabla-progresion td:nth-child(1n+2),
        .tabla-progresion th:nth-child(1n+2) {
            border-left: 1.7px solid #6c757d;
        }
    </style>
</head>
<body class="bg-light">
<div th:insert="~{fragments/navbar :: navbar}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-12">

            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <strong th:text="${mensaje}"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Header -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0" th:text="${rutina.nombre}"></h2>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <p class="text-muted" th:text="${rutina.descripcion}"></p>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body">
                                    <p class="mb-2">
                                        <strong>Semanas:</strong>
                                        <span th:text="${rutina.cantidadSemanas}"></span>
                                    </p>
                                    <p class="mb-0">
                                        <strong>Días:</strong>
                                        <span th:text="${rutina.cantidadDias}"></span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DÍAS -->
            <div th:each="diaData : ${diasDetalle}" class="card shadow-sm mb-4">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0" th:text="'Día ' + ${diaData.dia}"></h5>
                </div>

                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm tabla-progresion">

                            <!-- HEADER MULTINIVEL -->
                            <thead class="table-light">
                            <tr>
                                <th rowspan="2">Ejercicio</th>
                                <th th:each="semana : ${#numbers.sequence(1, rutina.cantidadSemanas)}"
                                    class="text-center"
                                    colspan="5"
                                    th:text="'S' + ${semana}">
                                </th>
                            </tr>
                            <tr>
                                <th:block th:each="semana : ${#numbers.sequence(1, rutina.cantidadSemanas)}">
                                    <th class="text-center col-semana">Series</th>
                                    <th class="text-center col-semana">Reps</th>
                                    <th class="text-center col-semana">Kg</th>
                                    <th class="text-center col-semana">Descanso</th>
                                    <th class="text-center col-semana">RIR</th>
                                </th:block>
                            </tr>
                            </thead>

                            <!-- BODY: se itera directo sobre ejercicio.semanas (ya vienen ordenadas
                                 1..cantidadSemanas), sin necesidad de "buscar" cada semana -->
                            <tbody>
                            <tr th:each="ejercicio : ${diaData.ejercicios}">
                                <td th:text="${ejercicio.nombreEjercicio}"></td>

                                <th:block th:each="s : ${ejercicio.semanas}">
                                    <td class="text-center col-semana" th:text="${s.series}"></td>
                                    <td class="text-center col-semana" th:text="${s.repeticiones}"></td>
                                    <td class="text-center col-semana" th:text="${s.pesoKg} ?: '-'"></td>
                                    <td class="text-center col-semana" th:text="${s.descansoMinutos} ?: '-'"></td>
                                    <td class="text-center col-semana" th:text="${s.rir} ?: '-'"></td>
                                </th:block>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- CARD: Asignar rutina a un alumno -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">Asignar rutina a un alumno</h4>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(alumnosDisponibles)}"
                         class="alert alert-warning">
                        No hay alumnos disponibles para asignar esta rutina.
                    </div>
                    <div th:if="${!#lists.isEmpty(alumnosDisponibles)}"
                         class="row">
                        <div class="col-md-8">
                            <form th:action="@{/rutinas/{id}/asignar-alumno(id=${rutina.id})}"
                                  method="POST"
                                  class="d-flex gap-2">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>
                                <select class="form-select"
                                        name="alumnoId"
                                        required>
                                    <option value="">-- Selecciona un alumno --</option>
                                    <option th:each="alumno : ${alumnosDisponibles}"
                                            th:value="${alumno.id}"
                                            th:text="${alumno.nombreApellido}">
                                    </option>
                                </select>
                                <button type="submit"
                                        class="btn btn-success">
                                    Asignar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ACCIONES -->
            <div class="d-flex gap-2 mb-4">
                <a href="/rutinas" class="btn btn-secondary">Volver</a>
                <a th:href="@{/rutinas/editar/{id}(id=${rutina.id})}" class="btn btn-warning">Editar</a>
                <a th:href="@{/rutinas/eliminar/{id}(id=${rutina.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('¿Estás seguro de que deseas eliminar esta rutina?')">
                    Eliminar
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
