<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Rutina - GymRutine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .col-semana {
            font-size: 0.85rem;
            padding: 0.5rem 0.25rem !important;
            min-width: 60px;
        }

        .tabla-progresion th {
            font-size: 0.9rem;
        }

        th[colspan="2"] {
            background-color: #e9ecef;
            font-weight: bold;
        }
       .tabla-progresion td:nth-child(1n+4),
        .tabla-progresion th:nth-child(1n+4) {
            border-left: 1.7px solid #6c757d;
        }
    </style>
</head>
<body class="bg-light">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-12">

            <!-- Mensaje -->
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                <strong th:text="${mensaje}"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Header -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0" th:text="${rutina.nombre}"></h2>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <p class="text-muted" th:text="${rutina.descripcion}"></p>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body">
                                    <p class="mb-2">
                                        <strong>Semanas:</strong>
                                        <span th:text="${rutina.cantidadSemanas}"></span>
                                    </p>
                                    <p class="mb-0">
                                        <strong>Días:</strong>
                                        <span th:text="${rutina.rutinaBloques.size()}"></span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <!-- BLOQUES -->
            <div th:each="rutinaBloque : ${rutina.rutinaBloques}" class="card shadow-sm mb-4">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0"
                        th:text="'Día ' + ${rutinaBloque.orden} + ': ' + ${rutinaBloque.bloque.nombre}">
                    </h5>
                </div>

                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm tabla-progresion">

                            <!-- HEADER MULTINIVEL -->
                            <thead class="table-light">

                            <!-- FILA 1 -->
                            <tr>
                                <th rowspan="2">Ejercicio</th>
                                <th rowspan="2">Series</th>
                                <th rowspan="2">Descanso</th>

                                <th th:each="semana : ${#numbers.sequence(1, rutina.cantidadSemanas)}"
                                    class="text-center"
                                    colspan="2"
                                    th:text="'S' + ${semana}">
                                </th>
                            </tr>

                            <!-- FILA 2 -->
                            <tr>
                                <th:block th:each="semana : ${#numbers.sequence(1, rutina.cantidadSemanas)}">
                                    <th class="text-center">Reps</th>
                                    <th class="text-center">Kg</th>
                                </th:block>
                            </tr>

                            </thead>

                            <!-- BODY -->
                            <tbody>
                            <tr th:each="bloqueEjercicio : ${rutinaBloque.bloque.bloqueEjercicio}">

                                <td th:text="${bloqueEjercicio.ejercicio.nombre}"></td>
                                <td th:text="${bloqueEjercicio.series}"></td>
                                <td th:text="${bloqueEjercicio.descansoMinutos}"></td>

                                <!-- SEMANAS -->
                                <th:block th:each="semana : ${#numbers.sequence(1, rutina.cantidadSemanas)}">

                                    <th:block
                                            th:with="datoSemana=${semanasMap.get(rutinaBloque.id)?.get(bloqueEjercicio.id)?.get(semana)}">

                                        <!-- REPS -->
                                        <td class="text-center col-semana">
                                            <span th:if="${datoSemana != null}"
                                                  th:text="${datoSemana.repeticiones}"></span>
                                            <span th:if="${datoSemana == null}" class="text-muted">-</span>
                                        </td>

                                        <!-- KG -->
                                        <td class="text-center col-semana">
                                            <span th:if="${datoSemana != null}"
                                                  th:text="${datoSemana.pesoKg}"></span>
                                            <span th:if="${datoSemana == null}" class="text-muted">-</span>
                                        </td>

                                    </th:block>

                                </th:block>

                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-3">
                        <button type="button"
                                class="btn btn-sm btn-primary"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#modalProgresion-' + ${rutinaBloque.id}">
                            Cargar/Editar Progresión
                        </button>
                    </div>

                    <!-- MODAL para cargar progresión del bloque -->
                    <div class="modal fade"
                         th:id="'modalProgresion-' + ${rutinaBloque.id}"
                         tabindex="-1"
                         role="dialog">
                        <div class="modal-dialog modal-xl" role="document">
                            <div class="modal-content">
                                <div class="modal-header bg-primary text-white">
                                    <h5 class="modal-title" th:text="'Progresión: ' + ${rutinaBloque.bloque.nombre}"></h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>

                                <div class="modal-body">
                                    <!-- Tabla con ejercicios del bloque -->
                                    <div class="table-responsive">
                                        <table class="table table-bordered table-sm">
                                            <thead class="table-light">
                                            <tr>
                                                <th style="width: 200px;">Ejercicio</th>
                                                <th>Series</th>
                                                <th>Descanso</th>
                                                <!-- Columnas dinámicas de semanas -->
                                                <th th:each="semana : ${#numbers.sequence(1, rutina.cantidadSemanas)}"
                                                    class="text-center"
                                                    th:text="'S' + ${semana}"></th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <!-- Ejercicios del bloque -->
                                            <tr th:each="bloqueEjercicio, ejercicioIter : ${rutinaBloque.bloque.bloqueEjercicio}">
                                                <td th:text="${bloqueEjercicio.ejercicio.nombre}"></td>
                                                <td th:text="${bloqueEjercicio.series}"></td>
                                                <td th:text="${bloqueEjercicio.descansoMinutos}"></td>

                                                <!-- Celdas con inputs para cada semana -->
                                                <td th:each="semana, semanaIter : ${#numbers.sequence(1, rutina.cantidadSemanas)}"
                                                    class="text-center"
                                                    style="padding: 0.5rem;">

                                                    <div th:with="indice=${ejercicioIter.index * rutina.cantidadSemanas + semanaIter.index}">
                                                        <!-- Buscar dato existente para esta semana -->
                                                        <th:block th:with="datoSemana=${semanasMap.get(rutinaBloque.id)?.get(bloqueEjercicio.id)?.get(semana)}">

                                                            <!-- Input Kg -->
                                                            <input type="text"
                                                                   class="form-control form-control-sm"
                                                                   th:id="'kg-' + ${rutinaBloque.id} + '-' + ${bloqueEjercicio.id} + '-' + ${semana}"
                                                                   th:value="${datoSemana?.pesoKg}"
                                                                   placeholder="Kg"
                                                                   style="font-size: 0.8rem; padding: 0.25rem;">
                                                            <!-- Input Reps -->
                                                            <input type="text"
                                                                   class="form-control form-control-sm mb-1"
                                                                   th:id="'reps-' + ${rutinaBloque.id} + '-' + ${bloqueEjercicio.id} + '-' + ${semana}"
                                                                   th:value="${datoSemana?.repeticiones}"
                                                                   placeholder="Reps"
                                                                   style="font-size: 0.8rem; padding: 0.25rem;">

                                                        </th:block>
                                                    </div>
                                                </td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="button"
                                            class="btn btn-primary"
                                            th:onclick="'guardarProgresionBloque(' + ${rutina.id} + ', ' + ${rutinaBloque.id} + ')'">
                                        Guardar Progresión
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <!-- ACCIONES -->
            <div class="d-flex gap-2 mb-4">
                <a href="/rutinas" class="btn btn-secondary">Volver</a>
                <a th:href="@{/rutinas/editar/{id}(id=${rutina.id})}" class="btn btn-warning">Editar</a>
                <button class="btn btn-danger" onclick="confirmarEliminar()">Eliminar</button>
                <a href="#" class="btn btn-success">Exportar PDF</a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function confirmarEliminar() {
        if (confirm('¿Estás seguro de que deseas eliminar esta rutina?')) {
            alert('Funcionalidad de eliminar pendiente');
        }
    }

    function guardarProgresionBloque(rutinaId, bloqueId) {
    // Recolectar todos los inputs del modal activo
    const modal = document.getElementById('modalProgresion-' + bloqueId);
    const inputs = modal.querySelectorAll('input[type="text"]');

    // Construir objeto con datos
    const semanas = [];
    const procesados = new Set();

    inputs.forEach(input => {
        const id = input.id;
        if (id.startsWith('reps-')) {
            const [, bId, eId, semana] = id.split('-');
            const key = `${bId}-${eId}-${semana}`;

            if (!procesados.has(key)) {
                const reps = input.value;
                const kgInput = document.getElementById(`kg-${bId}-${eId}-${semana}`);
                const kg = kgInput ? kgInput.value : '';

                if (reps || kg) { // Solo agregar si tiene datos
                    semanas.push({
                        rutinaBloqueId: parseInt(bId),
                        bloqueEjercicioId: parseInt(eId),
                        numeroSemana: parseInt(semana),
                        repeticiones: reps,
                        pesoKg: kg
                    });
                }
                procesados.add(key);
            }
        }
    });

    // Obtener token CSRF
    const csrfToken = document.querySelector('input[name="_csrf"]')?.value;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

    // Enviar POST
    fetch(`/rutinas/${rutinaId}/bloque/${bloqueId}/cargar`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            [csrfHeader || 'X-CSRF-TOKEN']: csrfToken
        },
        body: JSON.stringify({ semanas: semanas })
    })
    .then(response => {
        if (response.ok) {
            // Cerrar modal
            const modalElement = document.getElementById('modalProgresion-' + bloqueId);
            const modal = bootstrap.Modal.getInstance(modalElement);
            modal.hide();

            // Recargar página para ver cambios
            location.reload();
        } else {
            return response.json().then(data => {
                alert('Error al guardar: ' + (data.error || 'Error desconocido'));
            });
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error al guardar la progresión: ' + error);
    });
}
</script>
</body>
</html>
