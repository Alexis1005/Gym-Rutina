<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rutinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="fragments/navbar :: navbar"></div>
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Rutinas</h2>
        <a href="/rutinas/crear" class="btn btn-primary">+ Nueva Rutina</a>
    </div>

    <div th:if="${#lists.isEmpty(rutinas)}" class="alert alert-info">
        No hay rutinas creadas todavía.
    </div>

    <table class="table table-bordered table-hover" th:if="${!#lists.isEmpty(rutinas)}">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Semanas</th>
            <th style="width: 220px;">Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="rutina : ${rutinas}">
            <td th:text="${rutina.nombre}"></td>
            <td th:text="${rutina.cantidadSemanas}"></td>
            <td>
                <a th:href="@{/rutinas/{id}(id=${rutina.id})}" class="btn btn-sm btn-info">
                    Ver
                </a>

                <a th:href="@{/rutinas/editar/{id}(id=${rutina.id})}" class="btn btn-sm btn-warning">
                    Editar
                </a>

                <a th:href="@{/rutinas/eliminar/{id}(id=${rutina.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Seguro que querés eliminar esta rutina?');">
                    Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
<!-- Mensajes flash -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle"></i>
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-circle"></i>
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
