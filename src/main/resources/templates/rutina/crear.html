<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Rutina - GymRutine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:insert="fragments/navbar :: navbar"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-11">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Crear Rutina</h2>
                </div>
                <div class="card-body">

                    <form th:object="${rutina}" method="POST" action="/rutinas" id="rutinaForm">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <strong>Error:</strong>
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                            </ul>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- SECCIÓN 1: Datos básicos -->
                        <div class="mb-4">
                            <h4 class="border-bottom pb-2">Información Básica</h4>

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre de la Rutina *</label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}">
                                    <span th:errors="*{nombre}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Observaciones</label>
                                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
                            </div>

                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label for="cantidadSemanas" class="form-label">Cantidad de Semanas *</label>
                                    <input type="number" class="form-control" id="cantidadSemanas"
                                           th:field="*{cantidadSemanas}" min="1"
                                           th:classappend="${#fields.hasErrors('cantidadSemanas')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidadSemanas')}">
                                        <span th:errors="*{cantidadSemanas}"></span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="cantidadDias" class="form-label">Cantidad de Días *</label>
                                    <input type="number" class="form-control" id="cantidadDias"
                                           th:field="*{cantidadDias}" min="1"
                                           th:classappend="${#fields.hasErrors('cantidadDias')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidadDias')}">
                                        <span th:errors="*{cantidadDias}"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-3">
                                <button type="button" class="btn btn-outline-primary" id="btnGenerarDias">
                                    Generar días
                                </button>
                                <span class="text-muted ms-2">Completá semanas y días, después tocá este botón.</span>
                            </div>
                        </div>

                        <!-- SECCIÓN 2: Días generados dinámicamente -->
                        <div class="mb-4">
                            <h4 class="border-bottom pb-2">Ejercicios por Día</h4>
                            <div id="diasContainer"></div>
                            <div id="sinDiasMsg" class="alert alert-info">
                                Generá los días para empezar a cargar ejercicios.
                            </div>
                        </div>

                        <!-- Inputs ocultos que se arman antes de enviar -->
                        <div id="ejerciciosHidden"></div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Crear Rutina</button>
                            <a href="/rutinas" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===================================================================== -->
<!-- TEMPLATE de un día: se clona por JS tantas veces como cantidadDias -->
<!-- ===================================================================== -->
<template id="diaTemplate">
    <div class="card mb-3 dia-block">
        <div class="card-header bg-info text-white dia-titulo">
            Día
        </div>
        <div class="card-body">

            <!-- Filtros de búsqueda de ejercicio -->
            <div class="row g-2 mb-2">
                <div class="col">
                    <label class="form-label">Grupo Muscular</label>
                    <select class="form-select filtro-select" data-param="grupoMuscularId">
                        <option value="">-- Todos --</option>
                        <option th:each="g : ${gruposMusculares}" th:value="${g.id}" th:text="${g.nombre}"></option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">Tipo Articular</label>
                    <select class="form-select filtro-select" data-param="tipoArticular">
                        <option value="">-- Todos --</option>
                        <option th:each="e : ${tiposArticulares}" th:value="${e}" th:text="${e}"></option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">Cadena Cinética</label>
                    <select class="form-select filtro-select" data-param="cadenaCinetica">
                        <option value="">-- Todas --</option>
                        <option th:each="e : ${cadenasCineticas}" th:value="${e}" th:text="${e}"></option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">Lateralidad</label>
                    <select class="form-select filtro-select" data-param="lateralidad">
                        <option value="">-- Todas --</option>
                        <option th:each="e : ${lateralidades}" th:value="${e}" th:text="${e}"></option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">Elemento</label>
                    <select class="form-select filtro-select" data-param="elemento">
                        <option value="">-- Todos --</option>
                        <option th:each="e : ${elementos}" th:value="${e}" th:text="${e}"></option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">Posición</label>
                    <select class="form-select filtro-select" data-param="posicion">
                        <option value="">-- Todas --</option>
                        <option th:each="e : ${posiciones}" th:value="${e}" th:text="${e}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <button type="button" class="btn btn-outline-secondary btn-buscar-ejercicios">Buscar ejercicios</button>
            </div>

            <!-- Resultado de la búsqueda -->
            <div class="row g-2 mb-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label">Ejercicio encontrado</label>
                    <select class="form-select select-ejercicio-resultado">
                        <option value="">-- Buscá primero --</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="button" class="btn btn-outline-primary w-100 btn-cargar-progresion">
                        Cargar progresión
                    </button>
                </div>
            </div>

            <!-- Tabla de progresión semanal (se llena según cantidadSemanas) -->
            <div class="tabla-progresion-wrapper mb-3" style="display:none;">
                <table class="table table-sm table-bordered tabla-progresion">
                    <thead class="table-light">
                    <tr>
                        <th>Semana</th>
                        <th>Series</th>
                        <th>Reps</th>
                        <th>Kg</th>
                        <th>Descanso</th>
                        <th>RIR</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button type="button" class="btn btn-primary btn-agregar-ejercicio">
                    Agregar ejercicio a este día
                </button>
            </div>

            <!-- Resumen de ejercicios ya agregados a este día -->
            <table class="table table-hover tabla-resumen-dia">
                <thead class="table-light">
                <tr>
                    <th>Ejercicio</th>
                    <th>Orden</th>
                    <th>Semanas cargadas</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Array en memoria con TODOS los ejercicios de TODOS los días
    let ejerciciosSeleccionados = [];

    document.getElementById('btnGenerarDias').addEventListener('click', generarDias);

    function generarDias() {
        const cantidadDias = parseInt(document.getElementById('cantidadDias').value);
        const cantidadSemanas = parseInt(document.getElementById('cantidadSemanas').value);

        if (!cantidadDias || cantidadDias <= 0) {
            alert('Ingresá una cantidad de días válida');
            return;
        }
        if (!cantidadSemanas || cantidadSemanas <= 0) {
            alert('Ingresá una cantidad de semanas válida');
            return;
        }
        if (ejerciciosSeleccionados.length > 0) {
            if (!confirm('Ya hay ejercicios cargados. Generar los días de nuevo los va a borrar. ¿Continuar?')) {
                return;
            }
        }

        ejerciciosSeleccionados = [];
        const container = document.getElementById('diasContainer');
        container.innerHTML = '';

        const template = document.getElementById('diaTemplate');

        for (let dia = 1; dia <= cantidadDias; dia++) {
            const clone = template.content.cloneNode(true);
            const diaBlock = clone.querySelector('.dia-block');
            diaBlock.dataset.dia = dia;
            diaBlock.querySelector('.dia-titulo').textContent = 'Día ' + dia;

            // Botones de este día
            diaBlock.querySelector('.btn-buscar-ejercicios').addEventListener('click', function () {
                buscarEjercicios(diaBlock);
            });
            diaBlock.querySelector('.btn-cargar-progresion').addEventListener('click', function () {
                cargarProgresion(diaBlock, cantidadSemanas);
            });
            diaBlock.querySelector('.btn-agregar-ejercicio').addEventListener('click', function () {
                agregarEjercicioADia(diaBlock);
            });

            container.appendChild(diaBlock);
        }

        document.getElementById('sinDiasMsg').style.display = 'none';
    }

    function buscarEjercicios(diaBlock) {
        const params = new URLSearchParams();
        diaBlock.querySelectorAll('.filtro-select').forEach(function (select) {
            if (select.value) {
                params.append(select.dataset.param, select.value);
            }
        });

        fetch('/ejercicios/buscar?' + params.toString())
            .then(function (resp) {
                if (!resp.ok) {
                    throw new Error('Error al buscar ejercicios');
                }
                return resp.json();
            })
            .then(function (ejercicios) {
                const select = diaBlock.querySelector('.select-ejercicio-resultado');
                select.innerHTML = '';

                if (ejercicios.length === 0) {
                    select.innerHTML = '<option value="">-- Sin resultados --</option>';
                    return;
                }

                select.innerHTML = '<option value="">-- Elegí un ejercicio --</option>';
                ejercicios.forEach(function (ej) {
                    const option = document.createElement('option');
                    option.value = ej.id;
                    option.textContent = ej.nombre;
                    select.appendChild(option);
                });
            })
            .catch(function () {
                alert('Ocurrió un error buscando ejercicios');
            });
    }

    function cargarProgresion(diaBlock, cantidadSemanas) {
        const select = diaBlock.querySelector('.select-ejercicio-resultado');
        if (!select.value) {
            alert('Elegí un ejercicio antes de cargar la progresión');
            return;
        }

        const tbody = diaBlock.querySelector('.tabla-progresion tbody');
        tbody.innerHTML = '';

        for (let semana = 1; semana <= cantidadSemanas; semana++) {
            const row = document.createElement('tr');
            row.dataset.semana = semana;
            row.innerHTML = `
                <td class="align-middle">S${semana}</td>
                <td><input type="number" class="form-control form-control-sm input-series" min="1"></td>
                <td><input type="text" class="form-control form-control-sm input-peso"></td>
                <td><input type="text" class="form-control form-control-sm input-reps"></td>
                <td><input type="text" class="form-control form-control-sm input-descanso"></td>
                <td><input type="number" class="form-control form-control-sm input-rir"></td>
                <td><input type="text" class="form-control form-control-sm input-cadencia"></td>
                <td><input type="text" class="form-control form-control-sm input-metodo"></td>
            `;
            tbody.appendChild(row);
        }

        diaBlock.querySelector('.tabla-progresion-wrapper').style.display = 'block';
    }

    function agregarEjercicioADia(diaBlock) {
        const dia = parseInt(diaBlock.dataset.dia);
        const select = diaBlock.querySelector('.select-ejercicio-resultado');
        const ejercicioId = parseInt(select.value);
        const nombreEjercicio = select.options[select.selectedIndex].textContent;

        if (!ejercicioId) {
            alert('Elegí un ejercicio primero');
            return;
        }

        const filas = diaBlock.querySelectorAll('.tabla-progresion tbody tr');
        const semanas = [];
        let huboError = false;

        filas.forEach(function (fila) {
            const series = fila.querySelector('.input-series').value;
            const reps = fila.querySelector('.input-reps').value;

            if (!series || !reps) {
                huboError = true;
            }

            semanas.push({
                semana: parseInt(fila.dataset.semana),
                series: parseInt(series),
                repeticiones: reps,
                pesoKg: fila.querySelector('.input-peso').value,
                descansoMinutos: fila.querySelector('.input-descanso').value,
                rir: fila.querySelector('.input-rir').value ? parseInt(fila.querySelector('.input-rir').value) : null,
                cadencia: fila.querySelector('.input-cadencia').value,
                metodo: fila.querySelector('.input-metodo').value
            });
        });

        if (huboError) {
            alert('Series y Repeticiones son obligatorios en todas las semanas');
            return;
        }

        // Orden automático: siguiente número dentro de este día
        const ordenSiguiente = ejerciciosSeleccionados.filter(function (e) {
            return e.dia === dia;
        }).length + 1;

        ejerciciosSeleccionados.push({
            dia: dia,
            ejercicioId: ejercicioId,
            nombreEjercicio: nombreEjercicio,
            orden: ordenSiguiente,
            semanas: semanas
        });

        actualizarTablaResumen(diaBlock, dia);

        // Reset para poder cargar el próximo ejercicio del día
        select.innerHTML = '<option value="">-- Buscá primero --</option>';
        diaBlock.querySelector('.tabla-progresion-wrapper').style.display = 'none';
        diaBlock.querySelector('.tabla-progresion tbody').innerHTML = '';
    }

    function actualizarTablaResumen(diaBlock, dia) {
        const tbody = diaBlock.querySelector('.tabla-resumen-dia tbody');
        tbody.innerHTML = '';

        const delDia = ejerciciosSeleccionados
            .filter(function (e) { return e.dia === dia; })
            .sort(function (a, b) { return a.orden - b.orden; });

        delDia.forEach(function (ej) {
            const indexGlobal = ejerciciosSeleccionados.indexOf(ej);
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${ej.nombreEjercicio}</td>
                <td>${ej.orden}</td>
                <td>${ej.semanas.length}</td>
                <td><button type="button" class="btn btn-sm btn-danger btn-eliminar-ejercicio">Eliminar</button></td>
            `;
            row.querySelector('.btn-eliminar-ejercicio').addEventListener('click', function () {
                eliminarEjercicio(indexGlobal, diaBlock, dia);
            });
            tbody.appendChild(row);
        });
    }

    function eliminarEjercicio(indexGlobal, diaBlock, dia) {
        ejerciciosSeleccionados.splice(indexGlobal, 1);

        // Renumerar el orden de los que quedaron en ese día
        let orden = 1;
        ejerciciosSeleccionados
            .filter(function (e) { return e.dia === dia; })
            .forEach(function (e) { e.orden = orden++; });

        actualizarTablaResumen(diaBlock, dia);
    }

    function construirInputsOcultos() {
        const contenedor = document.getElementById('ejerciciosHidden');
        contenedor.innerHTML = '';

        ejerciciosSeleccionados.forEach(function (ej, i) {
            agregarHidden(contenedor, `ejercicios[${i}].ejercicioId`, ej.ejercicioId);
            agregarHidden(contenedor, `ejercicios[${i}].dia`, ej.dia);
            agregarHidden(contenedor, `ejercicios[${i}].orden`, ej.orden);

            ej.semanas.forEach(function (sem, j) {
                const prefix = `ejercicios[${i}].semanas[${j}]`;
                agregarHidden(contenedor, `${prefix}.semana`, sem.semana);
                agregarHidden(contenedor, `${prefix}.series`, sem.series);
                agregarHidden(contenedor, `${prefix}.repeticiones`, sem.repeticiones);
                agregarHidden(contenedor, `${prefix}.pesoKg`, sem.pesoKg);
                agregarHidden(contenedor, `${prefix}.descansoMinutos`, sem.descansoMinutos);
                agregarHidden(contenedor, `${prefix}.rir`, sem.rir);
                agregarHidden(contenedor, `${prefix}.cadencia`, sem.cadencia);
                agregarHidden(contenedor, `${prefix}.metodo`, sem.metodo);
            });
        });
    }

    function agregarHidden(contenedor, nombre, valor) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = nombre;
        input.value = (valor === null || valor === undefined) ? '' : valor;
        contenedor.appendChild(input);
    }

    document.getElementById('rutinaForm').addEventListener('submit', function (e) {
        if (ejerciciosSeleccionados.length === 0) {
            e.preventDefault();
            alert('Agregá al menos un ejercicio antes de crear la rutina');
            return;
        }
        construirInputsOcultos();
    });
</script>
</body>
</html>
