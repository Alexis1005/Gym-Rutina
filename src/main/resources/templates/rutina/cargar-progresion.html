<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Progresión - GymRutine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-celda-semana {
            padding: 6px !important;
            min-width: 120px;
        }
        .input-reps, .input-kg {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
            max-width: 100%;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-12">

            <!-- Header -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0" th:text="${rutina.nombre}"></h2>
                </div>
                <div class="card-body">
                    <p class="text-muted" th:text="${rutina.descripcion}"></p>
                    <p><strong>Semanas:</strong> <span th:text="${rutina.cantidadSemanas}"></span></p>
                </div>
            </div>

            <!-- Mensaje de éxito -->
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong th:text="${mensaje}"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Formulario -->
            <form th:object="${cargarProgresion}" method="POST" th:action="@{/rutinas/{id}/cargar-progresion(id=${rutina.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Errores generales -->
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Error:</strong>
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                    </ul>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Tabla de progresión -->
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Progresión por Semana</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-sm">
                                <thead class="table-light">
                                <tr>
                                    <th style="width: 200px;">Ejercicio</th>
                                    <th th:each="semana : ${#numbers.sequence(1, rutina.cantidadSemanas)}"
                                        class="text-center"
                                        th:text="'Semana ' + ${semana}"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <th:block th:each="rutinaBloque, bloqueIter : ${rutina.rutinaBloques}">
                                    <!-- Fila con nombre del bloque -->
                                    <tr>
                                        <td colspan="100%" class="bg-info text-white fw-bold"
                                            th:text="'Día ' + ${rutinaBloque.orden} + ': ' + ${rutinaBloque.bloque.nombre}"></td>
                                    </tr>

                                    <!-- Filas de ejercicios del bloque -->
                                    <tr th:each="bloqueEjercicio, ejercicioIter : ${rutinaBloque.bloque.bloqueEjercicio}">
                                        <td th:text="${bloqueEjercicio.ejercicio.nombre}"></td>

                                        <!-- Celdas con inputs para cada semana -->
                                        <td th:each="semana, semanaIter : ${#numbers.sequence(1, rutina.cantidadSemanas)}"
                                            class="table-celda-semana">

                                            <!-- Calcular índice global único -->
                                            <th:block th:with="indice=${bloqueIter.index * (rutina.cantidadSemanas * rutina.rutinaBloques[0].bloque.bloqueEjercicio.size()) + ejercicioIter.index * rutina.cantidadSemanas + semanaIter.index}">

                                                <input type="hidden"
                                                       th:name="|semanas[${indice}].rutinaBloqueId|"
                                                       th:value="${rutinaBloque.id}">
                                                <input type="hidden"
                                                       th:name="|semanas[${indice}].bloqueEjercicioId|"
                                                       th:value="${bloqueEjercicio.id}">
                                                <input type="hidden"
                                                       th:name="|semanas[${indice}].numeroSemana|"
                                                       th:value="${semana}">

                                                <!-- Input Peso -->
                                                <input type="text"
                                                       class="form-control form-control-sm input-kg"
                                                       th:name="|semanas[${indice}].pesoKg|"
                                                       th:field="*{semanas[__${indice}__].pesoKg}"
                                                       placeholder="Kg">
                                                <!-- Input Repeticiones -->
                                                <input type="text"
                                                       class="form-control form-control-sm input-reps mb-2"
                                                       th:name="|semanas[${indice}].repeticiones|"
                                                       th:field="*{semanas[__${indice}__].repeticiones}"
                                                       placeholder="Reps">

                                            </th:block>
                                        </td>
                                    </tr>
                                </th:block>
                                </tbody>
                            </table>
                        </div>

                        <div class="alert alert-info mt-3">
                            <small><strong>Nota:</strong> Ingresa reps y kg. El peso puede usar comas (ej: 60,5)</small>
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-success">Guardar Progresión</button>
                    <a th:href="@{/rutinas/{id}(id=${rutina.id})}" class="btn btn-secondary">Volver</a>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
