<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Rutina - GymRutine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h2 class="mb-0">Editar Rutina</h2>
                </div>
                <div class="card-body">

                    <!-- SECCIÓN: Info de la rutina (SOLO LECTURA) -->
                    <div class="alert alert-info">
                        <strong>Información fija (no editable):</strong>
                        <p class="mb-1">Semanas: <span th:text="${rutina.cantidadSemanas}"></span></p>
                        <p class="mb-0">Bloques: <span th:text="${rutina.rutinaBloques.size()}"></span></p>
                    </div>

                    <!-- FORMULARIO -->
                    <form th:object="${rutinaActualizar}"
                          th:action="@{/rutinas/editar/{id}(id=${rutina.id})}"
                          method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- Errores -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <strong>Error:</strong>
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                            </ul>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Campo: Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de la Rutina *</label>
                            <input type="text"
                                   class="form-control"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}">
                                <span th:errors="*{nombre}"></span>
                            </div>
                        </div>

                        <!-- Campo: Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control"
                                      id="descripcion"
                                      th:field="*{descripcion}"
                                      rows="3"></textarea>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Guardar cambios</button>
                            <a href="/rutinas" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>

                </div>
            </div>

            <!-- SECCIÓN: Bloques de la rutina (INFORMACIÓN COMPLEMENTARIA) -->
            <div class="card shadow-sm mt-4">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Bloques de la rutina</h5>
                </div>
                <div class="card-body">
                    <div th:if="${rutina.rutinaBloques.isEmpty()}" class="alert alert-warning">
                        Esta rutina no tiene bloques asignados.
                    </div>
                    <div th:if="!${rutina.rutinaBloques.isEmpty()}">
                        <table class="table table-sm table-hover">
                            <thead class="table-light">
                            <tr>
                                <th>Orden</th>
                                <th>Bloque</th>
                                <th>Ejercicios</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="rb : ${rutina.rutinaBloques}">
                                <td th:text="${rb.orden}"></td>
                                <td th:text="${rb.bloque.nombre}"></td>
                                <td th:text="${rb.bloque.bloqueEjercicio.size()}"></td>
                            </tr>
                            </tbody>
                        </table>
                        <p class="text-muted mt-3">
                            <small>Para cambiar bloques u orden, ve al detalle de la rutina.</small>
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
