<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Rutina - GymRutine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h2 class="mb-0">Editar Rutina</h2>
                </div>
                <div class="card-body">

                    <!-- FORMULARIO -->
                    <form th:object="${rutinaActualizar}" method="POST"
                          th:action="@{/rutinas/editar/{id}(id=${rutina.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- Errores generales -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show"
                             role="alert">
                            <strong>Error:</strong>
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                            </ul>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- SECCIÓN 1: Datos básicos -->
                        <div class="mb-4">
                            <h4 class="border-bottom pb-2">Información Básica</h4>

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre de la Rutina *</label>
                                <input type="text"
                                       class="form-control"
                                       id="nombre"
                                       th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}">
                                    <span th:errors="*{nombre}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control"
                                          id="descripcion"
                                          th:field="*{descripcion}"
                                          rows="3"></textarea>
                            </div>
                        </div>

                        <!-- SECCIÓN 2: Selector de bloques disponibles -->
                        <div class="mb-4">
                            <h4 class="border-bottom pb-2">Agregar/Quitar Bloques</h4>

                            <!-- Accordion de bloques disponibles -->
                            <div class="accordion mb-3" id="bloquesDisponiblesAccordion">
                                <div th:each="bloque, iter : ${rutinaBloques}" class="accordion-item">
                                    <h2 class="accordion-header">
                                        <button class="accordion-button collapsed"
                                                type="button"
                                                data-bs-toggle="collapse"
                                                th:attr="data-bs-target='#bloque-' + ${bloque.id}">
                                            <span th:text="${bloque.nombre}"></span>
                                            <span class="ms-2 badge bg-secondary"
                                                  th:text="${bloque.ejercicios.size()} + ' ejercicios'"></span>
                                        </button>
                                    </h2>
                                    <div th:id="'bloque-' + ${bloque.id}"
                                         class="accordion-collapse collapse"
                                         data-bs-parent="#bloquesDisponiblesAccordion">
                                        <div class="accordion-body">
                                            <!-- Tabla de ejercicios del bloque -->
                                            <table class="table table-sm table-hover mb-3">
                                                <thead class="table-light">
                                                <tr>
                                                    <th>Ejercicio</th>
                                                    <th>Series</th>
                                                    <th>Descanso (min)</th>
                                                </tr>
                                                </thead>
                                                <tbody>
                                                <tr th:each="ej : ${bloque.ejercicios}">
                                                    <td th:text="${ej.nombreEjercicio}"></td>
                                                    <td th:text="${ej.series}"></td>
                                                    <td th:text="${ej.descansoMinutos}"></td>
                                                </tr>
                                                </tbody>
                                            </table>

                                            <!-- Formulario para agregar bloque -->
                                            <div class="row g-2">
                                                <div class="col-md-6">
                                                    <label class="form-label">Orden del Bloque *</label>
                                                    <input type="number"
                                                           class="form-control"
                                                           th:id="'orden-' + ${bloque.id}"
                                                           min="1"
                                                           placeholder="Ej: 1">
                                                </div>
                                                <div class="col-md-6 d-flex align-items-end">
                                                    <button type="button"
                                                            class="btn btn-primary w-100 btn-agregar"
                                                            th:data-bloque-id="${bloque.id}"
                                                            th:data-bloque-nombre="${bloque.nombre}">
                                                        Agregar
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div th:if="${#lists.isEmpty(rutinaBloques)}" class="alert alert-info">
                                No hay bloques disponibles. Debes crear bloques primero.
                            </div>
                        </div>

                        <!-- SECCIÓN 3: Bloques seleccionados -->
                        <div class="mb-4">
                            <h4 class="border-bottom pb-2">Bloques de la Rutina *</h4>
                            <div th:if="${#fields.hasErrors('bloques')}" class="alert alert-danger">
                                <span th:errors="*{bloques}"></span>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-hover" id="bloquesSeleccionadosTable">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Bloque</th>
                                        <th>Orden</th>
                                        <th>Acción</th>
                                    </tr>
                                    </thead>
                                    <tbody id="bloquesContainer">
                                    </tbody>
                                </table>
                            </div>

                            <div id="sinBloquesMsg" class="alert alert-warning">
                                Selecciona al menos un bloque para la rutina.
                            </div>
                        </div>

                        <!-- Inputs ocultos para array de bloques - DENTRO DEL FORMULARIO -->
                        <div id="bloquesHidden"></div>

                        <!-- Botones -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Guardar Cambios</button>
                            <a href="/rutinas" class="btn btn-secondary">Cancelar</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    // Array en memoria - inicializado desde Thymeleaf con los bloques actuales
    let bloquesSeleccionados = /*[[${bloquesJS}]]*/ [];

    // Validar que sea un array válido
    if (!Array.isArray(bloquesSeleccionados)) {
        bloquesSeleccionados = [];
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Renderizar los bloques ya existentes
        actualizarTablaBloques();
    });

    // BOTONES AGREGAR
    document.querySelectorAll('.btn-agregar').forEach(btn => {
        btn.addEventListener('click', function() {
            const bloqueId = parseInt(this.dataset.bloqueId);
            const nombreBloque = this.dataset.bloqueNombre;
            agregarBloque(bloqueId, nombreBloque);
        });
    });

    function agregarBloque(bloqueId, nombreBloque) {
        const ordenInput = document.getElementById('orden-' + bloqueId);
        const orden = parseInt(ordenInput.value);

        if (!orden || orden <= 0) {
            alert('Debes ingresar un orden válido');
            return;
        }

        if (bloquesSeleccionados.some(b => b.orden === orden)) {
            alert('Ya existe un bloque con ese orden');
            return;
        }

        if (bloquesSeleccionados.some(b => b.bloqueId === bloqueId)) {
            alert('Ese bloque ya está agregado');
            return;
        }

        bloquesSeleccionados.push({
            bloqueId,
            nombreBloque,
            orden
        });

        ordenInput.value = '';
        actualizarTablaBloques();
    }

    window.eliminarBloque = function(index) {
        bloquesSeleccionados.splice(index, 1);
        actualizarTablaBloques();
    };

    function actualizarTablaBloques() {
        const container = document.getElementById('bloquesContainer');
        const bloquesHidden = document.getElementById('bloquesHidden');
        const sinBloquesMsg = document.getElementById('sinBloquesMsg');

        container.innerHTML = '';
        bloquesHidden.innerHTML = '';

        if (bloquesSeleccionados.length === 0) {
            sinBloquesMsg.style.display = 'block';
            return;
        }

        sinBloquesMsg.style.display = 'none';

        // Ordenar por orden
        const bloquesOrdenados = [...bloquesSeleccionados]
            .sort((a, b) => a.orden - b.orden);

        bloquesOrdenados.forEach((bloque, index) => {
            // TABLA
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${bloque.nombreBloque}</td>
                <td>${bloque.orden}</td>
                <td>
                    <button type="button"
                        class="btn btn-sm btn-danger"
                        onclick="eliminarBloque(${index})">
                        Eliminar
                    </button>
                </td>
            `;
            container.appendChild(row);

            // INPUTS OCULTOS - Nombre correcto: bloqueId (no rutinaBloqueId)
            const inputId = document.createElement('input');
            inputId.type = 'hidden';
            inputId.name = `bloques[${index}].bloqueId`;
            inputId.value = bloque.bloqueId;

            const inputOrden = document.createElement('input');
            inputOrden.type = 'hidden';
            inputOrden.name = `bloques[${index}].orden`;
            inputOrden.value = bloque.orden;

            bloquesHidden.appendChild(inputId);
            bloquesHidden.appendChild(inputOrden);
        });
    }

    // VALIDACIÓN FINAL
    document.querySelector('form').addEventListener('submit', function(e) {
        if (bloquesSeleccionados.length === 0) {
            e.preventDefault();
            alert('Debes agregar al menos un bloque');
        }
    });
</script>
</body>
</html>
