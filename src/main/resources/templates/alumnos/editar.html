<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Alumno - GymRutine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h2 class="mb-0">Editar Alumno</h2>
                </div>
                <div class="card-body">

                    <!-- FORMULARIO -->
                    <form th:object="${alumno}" method="POST" th:action="@{/alumnos/{id}(id=${alumno.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- Errores generales -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <strong>Error:</strong>
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                            </ul>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Nombre y Apellido -->
                        <div class="mb-3">
                            <label for="nombreApellido" class="form-label">Nombre y Apellido *</label>
                            <input type="text"
                                   class="form-control"
                                   id="nombreApellido"
                                   th:field="*{nombreApellido}"
                                   th:classappend="${#fields.hasErrors('nombreApellido')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreApellido')}">
                                <span th:errors="*{nombreApellido}"></span>
                            </div>
                        </div>

                        <!-- Observaciones -->
                        <div class="mb-3">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <textarea class="form-control"
                                      id="observaciones"
                                      th:field="*{observaciones}"
                                      rows="3"></textarea>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Guardar Cambios</button>
                            <a href="/alumnos" class="btn btn-secondary">Cancelar</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
