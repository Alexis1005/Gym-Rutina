<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos - GymRutine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h2 class="mb-0">Alumnos</h2>
                    <a href="/alumnos/crear" class="btn btn-light btn-sm">+ Crear Alumno</a>
                </div>
                <div class="card-body">

                    <!-- Mensaje de éxito -->
                    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${mensaje}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Tabla de alumnos -->
                    <div th:if="${!#lists.isEmpty(alumnos)}" class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                            <tr>
                                <th>Nombre y Apellido</th>
                                <th>Observaciones</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="alumno : ${alumnos}">
                                <td th:text="${alumno.nombreApellido}"></td>
                                <td th:text="${alumno.observaciones}"></td>
                                <td>
                                    <a th:href="@{/alumnos/{id}(id=${alumno.id})}" class="btn btn-sm btn-info">Ver</a>
                                    <a th:href="@{/alumnos/{id}/editar(id=${alumno.id})}" class="btn btn-sm btn-warning">Editar</a>
                                    <a th:href="@{/alumnos/{id}/eliminar(id=${alumno.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Mensaje si no hay alumnos -->
                    <div th:if="${#lists.isEmpty(alumnos)}" class="alert alert-info">
                        No hay alumnos registrados. <a href="/alumnos/crear">Crear el primer alumno</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
